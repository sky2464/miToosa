name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, and Guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: dart analyze

      - name: Run Test Suite
        run: flutter test --reporter=github

      - name: Fetch base branch for path filters
        run: git fetch origin "${BASE_REF}" --depth=1

      - name: Conditional Docs Archival Check
        run: |
          if git diff --name-only "origin/${BASE_REF}"...HEAD | grep -E '^docs/.*\.md$' > /dev/null; then
            echo "Documentation changed, running verify_docs_archival.sh..."
            bash scripts/verify_docs_archival.sh
          else
            echo "No documentation changes detected, skipping archival check."
          fi

      - name: Conditional Prompt Injection Guard
        run: |
          if git diff --name-only "origin/${BASE_REF}"...HEAD | grep -E '^docs/mitoosa-design-system-2/' > /dev/null; then
            echo "Design docs changed, running check_prompt_injection.sh..."
            chmod +x scripts/check_prompt_injection.sh
            ./scripts/check_prompt_injection.sh docs/mitoosa-design-system-2
          else
            echo "No design doc changes detected, skipping prompt injection guard."
          fi
