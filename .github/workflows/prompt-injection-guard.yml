name: Prompt Injection Guard

on:
  pull_request:
    paths:
      - 'docs/mitoosa-design-system-2/**'
      - 'scripts/check_prompt_injection.sh'
      - '.github/workflows/prompt-injection-guard.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/mitoosa-design-system-2/**'
      - 'scripts/check_prompt_injection.sh'
      - '.github/workflows/prompt-injection-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    name: Prompt Injection Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prompt injection guard
        run: |
          chmod +x scripts/check_prompt_injection.sh
          ./scripts/check_prompt_injection.sh docs/mitoosa-design-system-2
