name: Daily Health Check

# BL-20 resolution: this workflow runs the daily `dart analyze` +
# `flutter test` health check in GitHub Actions instead of an agent's
# local environment. CI provides Flutter on PATH via subosito/flutter-action,
# removing the "Flutter command not found" failure mode that motivated #4.
#
# Failures auto-file a "Daily Health Check: Failures YYYY-MM-DD" issue;
# successes are silent (no issue created).

on:
  schedule:
    # Daily at 14:00 UTC (≈07:00 PT / 10:00 ET / 09:00 CT — early enough
    # for the day's first triage but late enough that overnight commits
    # have CI'd through their own PR checks).
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: dart analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          dart analyze 2>&1 | tee analyze.txt

      - name: flutter test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt

      - name: Determine status
        id: status
        run: |
          ANALYZE_RC="${{ steps.analyze.outcome }}"
          TEST_RC="${{ steps.test.outcome }}"
          if [ "$ANALYZE_RC" = "success" ] && [ "$TEST_RC" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi
          echo "analyze_rc=$ANALYZE_RC" >> "$GITHUB_OUTPUT"
          echo "test_rc=$TEST_RC" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          {
            echo "## Daily Health Check — $DATE"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| dart analyze | ${{ steps.analyze.outcome }} |"
            echo "| flutter test | ${{ steps.test.outcome }} |"
            echo ""
            echo "### dart analyze output"
            echo '```'
            tail -50 analyze.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### flutter test output (tail)"
            echo '```'
            tail -50 test.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File failure issue
        if: steps.status.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          TITLE="Daily Health Check: Failures $DATE"
          {
            echo "## Daily Automated Health Check — $DATE"
            echo ""
            echo "Automated CI health check detected failures."
            echo ""
            echo "- dart analyze: ${{ steps.analyze.outcome }}"
            echo "- flutter test: ${{ steps.test.outcome }}"
            echo ""
            echo "### dart analyze output (tail)"
            echo ''
            echo '```'
            tail -80 analyze.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### flutter test output (tail)"
            echo ''
            echo '```'
            tail -120 test.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "---"
            echo "_Filed automatically by the Daily Health Check workflow (BL-20 CI-based replacement for the legacy agent-env health check)._"
          } > body.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --label "bug,automated" \
            --body-file body.md

      - name: Fail job if any gate failed
        if: steps.status.outputs.status == 'fail'
        run: |
          echo "::error::Daily health check failed — see job summary and the filed issue."
          exit 1
