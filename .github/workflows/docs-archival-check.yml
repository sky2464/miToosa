name: Docs Archival Check

on:
  push:
    paths:
      - 'docs/**/*.md'
      - 'scripts/verify_docs_archival.sh'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'scripts/verify_docs_archival.sh'
  workflow_dispatch:

jobs:
  verify-docs-archival:
    name: Verify Docs Archival
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs archival state
        run: bash scripts/verify_docs_archival.sh
