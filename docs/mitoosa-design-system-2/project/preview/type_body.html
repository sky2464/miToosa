<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:baseline;gap:14px;}
  .meta{font:var(--t-body-sm);color:var(--fg-3);font-family:var(--font-mono);margin-left:auto;white-space:nowrap;}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="row"><span class="ds-body">Match identical patterns and find your flow.</span><span class="meta">body · 500 · 15</span></div>
  <div class="row"><span class="ds-body-sm">Tap the correct answer before time runs out.</span><span class="meta">body-sm · 500 · 13</span></div>
  <div class="row"><span class="ds-label">Medium</span><span class="meta">label · 700 · 12</span></div>
  <div class="row"><span class="ds-eyebrow">Progress</span><span class="meta">eyebrow · 800 · 10 · upper</span></div>
  <div class="row"><span class="ds-numeric">1,500,000</span><span class="meta">numeric · 800 · 32 · tabular</span></div>
</div>
</body></html>
