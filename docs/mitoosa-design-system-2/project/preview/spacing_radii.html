<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:14px;}
  .box{background:var(--bg-card);border:1px solid var(--border-card);}
  .label{font:var(--t-label);color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em;width:80px;}
  .meta{font:var(--t-body-sm);color:var(--fg-3);font-family:var(--font-mono);margin-left:auto;}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="row"><div class="label">8 px</div><div class="box" style="width:60px;height:30px;border-radius:8px;"></div><span class="meta">--radius-xs · chips</span></div>
  <div class="row"><div class="label">12 px</div><div class="box" style="width:60px;height:30px;border-radius:12px;"></div><span class="meta">--radius-sm</span></div>
  <div class="row"><div class="label">16 px</div><div class="box" style="width:60px;height:30px;border-radius:16px;"></div><span class="meta">--radius-md · nested wells</span></div>
  <div class="row"><div class="label">24 px</div><div class="box" style="width:60px;height:30px;border-radius:24px;"></div><span class="meta">--radius-lg · most cards</span></div>
  <div class="row"><div class="label">32 px</div><div class="box" style="width:60px;height:30px;border-radius:32px;"></div><span class="meta">--radius-xl · hero cards</span></div>
  <div class="row"><div class="label">pill</div><div class="box" style="width:60px;height:30px;border-radius:999px;"></div><span class="meta">--radius-pill · CTAs, chips</span></div>
</div>
</body></html>
