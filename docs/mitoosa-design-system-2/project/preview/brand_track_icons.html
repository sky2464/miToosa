<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
  img{width:96px;height:96px;border-radius:18px;background:rgba(255,255,255,0.04);object-fit:contain;border:1px solid var(--border-soft);}
  .name{font:var(--t-label);color:var(--fg-2);text-align:center;}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="cell"><img src="../assets/icons/track_pattern_match.png"/><div class="name">Pattern Match</div></div>
  <div class="cell"><img src="../assets/icons/track_shape_counter.png"/><div class="name">Shape Counter</div></div>
  <div class="cell"><img src="../assets/icons/track_color_code.png"/><div class="name">Color Code</div></div>
  <div class="cell"><img src="../assets/icons/track_logic_gates.png"/><div class="name">Logic Gates</div></div>
  <div class="cell"><img src="../assets/icons/track_memory.png"/><div class="name">Memory</div></div>
  <div class="cell"><img src="../assets/icons/track_number_crunch.png"/><div class="name">Number Crunch</div></div>
  <div class="cell"><img src="../assets/icons/track_sequence.png"/><div class="name">Sequence</div></div>
  <div class="cell"><img src="../assets/icons/track_spatial.png"/><div class="name">Spatial Sense</div></div>
</div>
</body></html>
