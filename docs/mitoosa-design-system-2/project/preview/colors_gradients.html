<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
  .grad{height:64px;border-radius:14px;display:flex;align-items:center;padding:0 18px;font:var(--t-label);text-transform:uppercase;letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);justify-content:space-between;}
  .grad .css{font-family:var(--font-mono);font-weight:500;font-size:11px;text-transform:none;letter-spacing:0;opacity:.95;}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="grad" style="background:var(--grad-primary)">grad-primary <span class="css">#3b82f6 → #a855f7</span></div>
  <div class="grad" style="background:var(--grad-cool)">grad-cool <span class="css">#22d3ee → #3b82f6</span></div>
  <div class="grad" style="background:var(--grad-magenta)">grad-magenta <span class="css">#a855f7 → #ec4899</span></div>
  <div class="grad" style="background:var(--grad-warm)">grad-warm <span class="css">#facc15 → #fb923c</span></div>
</div>
</body></html>
