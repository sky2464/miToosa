<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>miToosa — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0a0d17; color: #fff; font-family: var(--font-sans); min-height: 100vh; }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; box-sizing: border-box; }
  .devices { display: flex; gap: 48px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .device {
    width: 402px; height: 874px;
    border-radius: 48px; overflow: hidden;
    background: var(--bg-app);
    box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 10px #1a1a1f, 0 0 0 12px #000;
    position: relative;
  }
  .notch {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  }
  .indicator {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
    height: 34px; display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 8px; pointer-events: none;
  }
  .indicator span { width: 139px; height: 5px; border-radius: 100px; background: rgba(255,255,255,.7); }
  .status {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    padding: 16px 36px 10px; display: flex; justify-content: space-between;
    font: 600 15px var(--font-sans); color: #fff;
  }
  .scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding-top: 46px; }
  .scroll::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- Thumbnail for standalone bundler -->
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
    <rect width="200" height="200" fill="#0a0d17"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke="url(#tg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="220 365" transform="rotate(-90 100 100)"/>
    <text x="100" y="108" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="800" font-size="24">mi</text>
  </svg>
</template>

<div class="stage">
  <div class="devices">
    <div class="device" id="app1">
      <div class="status"><span>9:41</span><span>●●● ▫▫</span></div>
      <div class="notch"></div>
      <div class="scroll"><div id="root-1" style="height:100%"></div></div>
      <div class="indicator"><span></span></div>
    </div>
  </div>
</div>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="TracksScreen.jsx"></script>
<script type="text/babel" src="ProgressScreen.jsx"></script>
<script type="text/babel" src="LeaderboardScreen.jsx"></script>
<script type="text/babel" src="GameScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root-1'));
  root.render(<Shell/>);
</script>

</body>
</html>
