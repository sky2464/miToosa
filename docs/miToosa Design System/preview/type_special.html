<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:22px 24px;display:flex;gap:18px;align-items:center;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  .glow-text{font:var(--t-display-1);background:var(--grad-text-hero);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.02em;}
  .meta{font:var(--t-body-sm);color:var(--fg-3);font-family:var(--font-mono);}
  .ex{font:var(--t-h1);color:var(--fg-1);text-shadow:0 0 24px rgba(59,130,246,.4),0 0 48px rgba(168,85,247,.25);}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="stack">
    <div class="glow-text">Daily Goal</div>
    <div class="meta">grad-text-hero · clipped to text</div>
  </div>
  <div class="stack" style="margin-left:auto;">
    <div class="ex">LEVEL COMPLETE!</div>
    <div class="meta">white + blue/purple shadow glow</div>
  </div>
</div>
</body></html>
