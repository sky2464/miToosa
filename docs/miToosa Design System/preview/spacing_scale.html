<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--bg-app);color:var(--fg-1);}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:12px;}
  .name{font:var(--t-label);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);width:60px;}
  .bar{background:var(--grad-primary);height:14px;border-radius:7px;}
  .meta{font:var(--t-body-sm);color:var(--fg-3);font-family:var(--font-mono);margin-left:auto;}
</style></head>
<body class="ds-bg">
<div class="wrap">
  <div class="row"><div class="name">space-1</div><div class="bar" style="width:4px;"></div><span class="meta">4 px · ticks</span></div>
  <div class="row"><div class="name">space-2</div><div class="bar" style="width:8px;"></div><span class="meta">8 px · gaps</span></div>
  <div class="row"><div class="name">space-3</div><div class="bar" style="width:12px;"></div><span class="meta">12 px</span></div>
  <div class="row"><div class="name">space-4</div><div class="bar" style="width:16px;"></div><span class="meta">16 px · base</span></div>
  <div class="row"><div class="name">space-6</div><div class="bar" style="width:24px;"></div><span class="meta">24 px · card padding</span></div>
  <div class="row"><div class="name">space-7</div><div class="bar" style="width:32px;"></div><span class="meta">32 px · section gap</span></div>
  <div class="row"><div class="name">space-9</div><div class="bar" style="width:48px;"></div><span class="meta">48 px · hero gutter</span></div>
</div>
</body></html>
