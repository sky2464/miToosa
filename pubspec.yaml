name: mitoosa
description: A new Flutter game project based on the miToosa initiative.

publish_to: 'none'

version: 1.4.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.0.2
  go_router: ^17.1.0
  riverpod_annotation: ^4.0.2
  crypto: ^3.0.6
  share_plus: ^12.0.2  # blocked from 13.0.0 by flutter_secure_storage win32 conflict

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/content/worlds.json
    - assets/content/levels.json
    - assets/audio/
    - assets/images/avatars/
    - assets/images/badges/
    - assets/images/icons/
  # Fallback fonts (download into assets/fonts/ and register here).
  fonts:
    - family: 'Noto Sans'
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: 'Noto Sans Symbols'
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Regular.ttf
    - family: 'Noto Color Emoji'
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    # Roboto and MaterialIcons are optional fallbacks. The downloader
    # script attempts to fetch these; the script has succeeded and the
    # TTFs are available in `assets/fonts/`. Uncomment or keep enabled
    # as needed.
    - family: 'Roboto'
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: 'MaterialIcons'
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.ttf
